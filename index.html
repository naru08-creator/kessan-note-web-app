<meta property="og:type" content="website" />

<meta property="og:description" content="決算書を読むのが苦手な人向けの決算比較ツール。数字を入れるだけで自動計算・グラフ化し、複数年の推移や他社との比較がひと目で分かります。" />

<meta name="twitter:card" content="summary" />

<!-- React / ReactDOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Recharts（内部でprop-types / d3系を利用） -->
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<!-- JSXをブラウザ上でその場変換（ビルド不要） -->
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- CSVバックアップ／読み込み機能で使う -->
<script crossorigin src="https://unpkg.com/jszip@3/dist/jszip.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- 共通コア（Electron版と同じファイルをそのまま読み込む） -->
<script type="text/babel" src="./core/kessan-core.js"></script>

<!-- Web版専用：localStorageを使った保存アダプタ -->
<script type="text/babel">
  const STORAGE_KEY = 'kessan-note:companies';

  const webStorageAdapter = {
    async loadAll() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        console.error('localStorageの読み込みに失敗しました', e);
        return null;
      }
    },
    async saveAll(companies) {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ companies }));
    },
  };

  function App() {
    return (
      <window.KessanNoteCore
        storage={webStorageAdapter}
        platform="web"
        licenseUrl="https://github.com/naru08-creator/kessan-note-web-app?tab=License-1-ov-file"
        copyrightHolder="えるぴょん"
      />
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
